                <div class="input__group">

                    <input type="password" id="password" placeholder="password">
                </div>
            </div>

            <button onclick="login()">Sign Up</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://localhost:7025'; // Укажите порт вашего API

        async function register() {
            const nickname = document.getElementById('nickname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = '';

            try {
                const res = await fetch(`${API_URL}/api/register/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, email, phone, passwordHash: password }),
                    credentials: 'include'
                });

                if (res.ok) {
                    alert('Регистрация успешна! Теперь войдите в систему.');
                    window.location.href = 'login.html';
                } else {
                    const text = await res.text();
                    errorDiv.innerText = text || 'Ошибка регистрации';
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения с сервером';
                console.error(err);
            }
        }
    </script>
